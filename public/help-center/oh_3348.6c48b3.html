u003e If correct item was delivered as per goods description without any damage, the size is not suitable, or the customer does not like the product (color, material, style), we do not accept returns. We recommend that you carefully review the full description of the item and confirm that it meets all of your expectations before placing an order.\u003c/p\u003e\u003cp\u003eWe shall only accept returns of items that are unworn, unused and in the same condition you received them, with their original packaging and seal intact where applicable, unless the item became defective after delivery became damaged or defective after reasonable use &#65288;in accordance with manufacturers guidelines where applicable&#65289; during the returns period.\u003c/p\u003e\u003ch3\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003e\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003ch3\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003e3. Items that cannot be returned\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003ctable style=\"width: auto;\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003e Description\u003c/strong\u003e\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003eDetails\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cbr\u003eRegrettably, we are unable to provide after-sale support for products in cases where the reason is solely based on subjective consumer preferences.\u003cbr\u003e\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eApart from Global Shiping products, we also do not accept aftersale returns for the following items:\u003cbr\u003ePersonalized customization and design services, Virtual goods such as top-ups, software and promotional products priced at 1 shilling (applicable to other countries)Personal care products, including pads/bra pads, panties, socks/stockings/stockings/pantyhose, shapewear, body shaping pants, nipple covers, lingerie, adult products, or similar items.Beauty and skincare products, including but not limited to fragrances, manicures and pedicures, oral care, shaving and hair removal products, hair tools and accessories, wellness and relaxation products, earrings, etc.Special products such as smart devices, commercial kitchenware, industrial products, office supplies, electric vehicles, refurbished machines, etc.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNot \u0026nbsp;supported after unpacking\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cspan style=\"color: rgb(255, 0, 0);\"\u003eOuter Packaging: The outer packaging of the product must remain unopened and undamaged.\u003cbr\u003ePlastic Film (if any): If the product includes a plastic film, it should be intact and unaltered.\u003cbr\u003eSealed Package (if any): If the product is sealed, the package must remain unopened and undisturbed.\u003cbr\u003eBottle Cap: The bottle cap of the product should not be opened or tampered with.\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNot \u0026nbsp;supported after installation\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eproducts are not support aftersale due \u0026nbsp;to consumer subjective reasons, at same time product is not in good condition like product has been installed,such as assembly machinery, gas stoves, \u0026nbsp;etc.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNot \u0026nbsp;supported after activation \u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eproducts are not support after-sale due \u0026nbsp;to consumer subjective reasons, at same time product is not in good condition like product that is incomplete, such as notebooks, desktops, mobile \u0026nbsp;phones, PS4 products with activation restrictions, etc.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cp\u003e\u003cstrong\u003ePlease note we will also not accept after-sale :\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e1. Products not purchased from Kilimall (order serial numbers does not match);\u003c/p\u003e\u003cp\u003e2. Products that exceed the expiry date (Exceed warranty period);\u003c/p\u003e\u003cp\u003e3. Unauthorized repair, misuse, collision, negligence, abuse, into the liquid, accident, alteration, product quality problems caused by improper installation, or torn, altered labels of machine serial number or anti-counterfeiting mark;\u003c/p\u003e\u003cp\u003e4. The warranty card does not match the product and was altered.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat happen next if client returned the product and the after-sale service is not acceptable as per rules?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIf your return request was declined by the Kilimall Quality Check Team or seller \u0026nbsp;because the eligibility conditions for return were not met, or the return claim could not be confirmed after thorough testing (e.g., a phone or laptop with unbroken seals), the product will be sent back to you, and you will be responsible for the shipping fee.\u003c/p\u003e\u003cp\u003eIf you choose not to accept the returned item, it will be stored at Kilimall's warehouse or with the seller for \u003cstrong\u003e15 days\u003c/strong\u003e. After that period, if unclaimed, the item will be forfeited without a refund.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003e4. Product integrity standards\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003eIf the correct item was delivered as described and is undamaged, customer shall ensure that the returned product and related accessories (such as tag, manual, warranty card, network card, etc.) are complete, and maintain the original quality, function, no damage, mal-operation, anti-counterfeiting, and activation ( In the case of authorization, etc., there are no signs of use of the appearance of the original, and unreasonable use of personal data.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e&ldquo;Sealing&rdquo; \u003c/strong\u003emeans that the outer packaging of the product is sealed by the manufacturer (sealing) or integral plastic (tight) packaging.\u003c/p\u003e\u003cp\u003e&ldquo;\u003cstrong\u003eOuter packaging\u003c/strong\u003e&rdquo; means: the original packaging of the manufacturer (minimum sales unit), and does not include the packaging of the secondary packaging by the seller or the logistics service provider. The outer packaging of the product is an integral part of the product, and should be complete when returned, without serious damage or contamination. Cosmetics, personal care products, books, baby diapers, audio-visual products and other outer packagings are sealed at one time and shall not be unsealed.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003emissing or damage to the gift/accessories\u003c/strong\u003e and \u003cstrong\u003emissing of the invoice \u003c/strong\u003ewill not affect the product return. If the gift is damaged or lost, the discount will be processed (10% of the purchase price of the product), and the tax will be shift to customer due to lost of the invoice.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e5. Damage Definition and Regulations. \u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eWhat is Considered a Damaged Item (Report within 24 hours)\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003eA \u003c/span\u003e\u003cstrong\u003edamaged item\u003c/strong\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e means physical harm that occurred \u003c/span\u003e\u003cstrong\u003eduring transit or handling\u003c/strong\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e after leaving the warehouse but before delivery. Such damage \u003c/span\u003e\u003cstrong\u003emust be reported within 24 hours\u003c/strong\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e of delivery.\u003c/span\u003e\u003c/p\u003e\u003ctable style=\"width: auto;\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003eType of Damage\u003c/strong\u003e\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003eExamples\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eBroken or cracked\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eShattered screen, cracked bottle, snapped handle\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eLeaking or spilling\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eLiquid or powder escaping from its sealed container\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eDented or crushed\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eProduct misshapen due to impact (e.g., crushed can, bent metal)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eTorn or punctured packaging affecting product\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eBox ripped open and small parts fell out during transit\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eWet or stained from external moisture\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eRain-damaged box causing product to become wet or stained\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eBroken seal or tampering\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eVacuum seal broken, blister pack torn open in transit\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eReport within 24 hours by providing:\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e&middot; Order number\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e&middot; Clear photo of the damage\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e&middot; Photo of the outer packaging (if available)\u003c/span\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e What IS NOT Considered a Damaged Item (No 24-hour report needed)\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003eThe following issues are \u003c/span\u003e\u003cstrong\u003enot classified as transit damage\u003c/strong\u003e\u003cspan style=\"color: rgb(15, 17, 21); background-color: rgb(255, 255, 255);\"\u003e. They should be handled through normal returns, warranties, or customer support, not as a damage claim.\u003c/span\u003e\u003c/p\u003e\u003ctable style=\"width: auto;\"\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003e&#10060; Issue\u003c/strong\u003e\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003eWhy It's Not Transit Damage\u003c/strong\u003e\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003e\u003cstrong\u003eCorrect Handling\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eQuality defect (e.g., loose stitching, electronics not working, wrong color, poor fit, missing fragrance)\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eProduct arrived intact but has a manufacturing or design flaw\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eStandard return or warranty claim\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eMissing items due to packing error\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNo physical damage &mdash; item was simply not put in the box\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eMissing item claim (not damage claim)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eMinor scuff or surface mark\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eSuperficial abrasion only; does not affect function or structural integrity\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eCosmetic issue &mdash; not a damage claim\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eFactory cosmetic imperfection\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eBlemish or scratch present before shipping (not caused by transit)\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eQuality issue &mdash; return or exchange\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eCustomer mishandling after delivery\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eDamage caused by dropping, tearing, forcing, improper use, or accidental breakage by the customer\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNot eligible for shipping damage claim\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNormal wear and tear\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eFading, pilling, loosening, or other changes from regular use over time\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eExpected product aging &mdash; not a claim\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003ePackaging damage only\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eBox, bag, or wrapper is scuffed, dented, or torn, but the product inside is perfectly fine\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eNo claim needed\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eDamage reported after 24 hours\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eCannot verify damage occurred during transit\u003c/td\u003e\u003ctd colSpan=\"1\" rowSpan=\"1\" width=\"auto\"\u003eLate claim &mdash; will be denied unless extraordinary proof exists\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003ch3\u003e\u003cspan style=\"font-size: 16px;\"\u003e\u003cstrong\u003e6. Return process\u003c/strong\u003e\u003c/span\u003e\u003c/h3\u003e\u003cp\u003e \u003cimg src=\"http://mkp.obs.af-south-1.myhuaweicloud.com/c/h5/cms/imgs/aW1hZ2UucG5nMTc0OTA4OTg5MTMxOQ%3D%3D.png\" alt=\"\" data-href=\"\" style=\"\"/\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e Return \u0026 Refund Process:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"http://mkp.obs.af-south-1.myhuaweicloud.com/c/h5/cms/imgs/aW1hZ2UucG5nMTc0OTA4OTkzNjAyMA%3D%3D.png\" alt=\"\" data-href=\"\" style=\"\"/\u003e\u003c/p\u003e\
