#128167;green teardrop icon), shipped locally, usually take \u003cstrong\u003e3-12 working days\u003c/strong\u003e for delivery.\u003c/p\u003e\u003cp\u003e3. \"\u003cstrong\u003eFullfilled by Kilimal\u003c/strong\u003el\" orders (&#9889;orange lightning icon), shipped from Kilimall, have a delivery timeframe of \u003cstrong\u003e1-7 working days.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eF\u003cstrong\u003eor faster delivery, we recommend placing orders from local options like Fulfilled by Kilimall\u0026 Drop Shipping. \u003c/strong\u003eThank you for your understanding and patience.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://image.kilimall.com/c/h5/cms/1742354891185.png\" alt=\"\" data-href=\"\" style=\"\"/\u003e\u003cbr\u003ePlease note that the delivery/retum timeline excludes weekends and holidays. Services will resume on thenext working day.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eKilimall currently offers 3 types of delivery mode. (FBK/ Local/ Oversea )\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cimg src=\"https://image.kilimall.com/c/h5/cms/1742354894759.png\" alt=\"\" data-href=\"\" style=\"width: 735px;height: 416px;\"/\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eN.B Please note that due to some holidays, timeline may vary, kindly refer to your SNS/ App notice for real time information. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003e\u003cstrong\u003eFurther Concerns: \u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e1.If I didn't collect order when it arrives, what \u0026nbsp;suppose to do? \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eKindly ensure that you pick up your order within 1-3 days from the time it becomes available for collection.\u003c/p\u003e\u003cp\u003e1).The maximum holding time is 7 days for G4S pick-up and 14 days for Kilishop pick-up.\u003c/p\u003e\u003cp\u003e2).Failure to Collect: If you fail to collect your order within the specified timeframes, it will be returned. Please note that this will incur a second delivery fee for the resend.\u003c/p\u003e\u003cp\u003e3).Authorized Pick-Up: If you are unable to personally collect the order, you can authorize someone else to pick it up on your behalf. The authorized person will need to present the following documents:\u003c/p\u003e\u003cp\u003eValid national ID, passport, or driving license, notification message confirming the order\u003c/p\u003e\u003cp\u003e4).G4S Pick-Up: If you choose G4S pick-up, please provide us with your friend's name and ID number for approval.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. How to check delivery time and track my order?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eTo track your order, please follow these steps:\u003c/p\u003e\u003cp\u003e1). Open the Kilimall app and navigate to \"Account\" \u0026gt; \"My Orders.\"\u003c/p\u003e\u003cp\u003e2). Locate your order and view the logistics information.\u003c/p\u003e\u003cp\u003e3). You can also search the order number or waybil number via link \u003ca href=\"http://k.kili.co/17ou6\" target=\"_blank\"\u003ehttp://k.kili.co/17ou6\u003c/a\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"6:[[\"$\",\"section\",null,{\"children\":[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":{\"@context\":\"https://schema.org\",\"@type\":\"WebSite\",\"name\":\"Kilimall\",\"alternateName\":[\"Affordable Online Shopping in Kenya\",\"Kilimall kenya\",\"Kilimall KE\",\"kilimall.co.ke\"],\"url\":\"https://wwww.kilimall.co.ke\"}}}]}],[\"$\",\"div\",null,{\"className\":\"page_home_page_wrapper__DNphe\",\"children\":[\"$\",\"$L10\",null,{\"mode\":\"PC\",\"pageConfig\":{\"name\":\"Delivery timeline: How long does my order arrive?  What is GS/ Local/ FBK?\",\"path\":\"/help-ce
